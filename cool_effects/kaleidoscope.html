<!DOCTYPE html>
<html>
<head>
    <title>Kaleidoscope</title>
    <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let angle = 0;

    function draw() {
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        
        ctx.save();
        ctx.translate(canvas.width/2, canvas.height/2);
        ctx.rotate(angle);
        
        for(let i=0; i<12; i++){
            ctx.rotate(Math.PI/6);
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.lineTo(100, 100);
            ctx.strokeStyle = `hsl(${angle*100 + i*30}, 100%, 50%)`;
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.beginPath();
            ctx.arc(150, 0, 20 + Math.sin(angle)*10, 0, Math.PI*2);
            ctx.fillStyle = `hsl(${angle*200 + i*30}, 100%, 50%)`;
            ctx.fill();
        }
        
        ctx.restore();
        angle += 0.02;
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
