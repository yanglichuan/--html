<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Racer - Game 10/100</title>
    <style>
        :root {
            --bg: #050505;
            --neon-blue: #00f2ff;
            --neon-pink: #ff007a;
            --neon-purple: #bc00ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            background: #000;
            border: 2px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            max-width: 95vw;
            max-height: 80vh;
        }

        .ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 10;
        }

        .stat {
            text-align: center;
            font-family: monospace;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .label { font-size: 10px; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; }
        .value { font-size: 24px; font-weight: 900; color: var(--neon-blue); }

        .game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 5, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        h1 {
            font-size: 48px;
            background: linear-gradient(to right, var(--neon-pink), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 35px;
            background: transparent;
            border: 2px solid var(--neon-blue);
            color: var(--neon-blue);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--neon-blue);
            color: black;
            box-shadow: 0 0 30px var(--neon-blue);
        }
        
        .controls-hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="ui">
        <div class="stat">
            <div class="label">SPEED</div>
            <div id="speed" class="value">0 KM/H</div>
        </div>
        <div class="stat">
            <div class="label">DISTANCE</div>
            <div id="distance" class="value">0 M</div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="game-over" class="game-over">
        <h1>SYSTEM CRASH</h1>
        <p id="final-distance" style="font-size: 24px; margin-bottom: 20px;">Distance: 0 M</p>
        <button onclick="initGame()">REBOOT</button>
    </div>

    <div class="controls-hint">Use Arrows or A/D to Drive</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const speedEl = document.getElementById('speed');
        const distanceEl = document.getElementById('distance');
        const gameOverEl = document.getElementById('game-over');

        let width = 400, height = 600;
        let car, obstacles, gameActive, speed, distance, offset;

        class Car {
            constructor() {
                this.width = 40;
                this.height = 70;
                this.x = width / 2 - this.width / 2;
                this.y = height - 120;
                this.targetX = this.x;
            }
            update() {
                this.x += (this.targetX - this.x) * 0.2;
            }
            draw() {
                ctx.fillStyle = '#00f2ff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f2ff';
                
                // Car Body
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 6);
                ctx.fill();
                
                // Cockpit
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + 8, this.y + 15, this.width - 16, 20);
                
                // Lights
                ctx.fillStyle = '#ff007a';
                ctx.fillRect(this.x + 5, this.y + 5, 8, 4);
                ctx.fillRect(this.x + this.width - 13, this.y + 5, 8, 4);
                
                ctx.shadowBlur = 0;
            }
        }

        class Obstacle {
            constructor() {
                this.width = 40 + Math.random() * 60;
                this.height = 20;
                this.x = Math.random() * (width - this.width);
                this.y = -100;
                this.color = Math.random() > 0.5 ? '#ff007a' : '#bc00ff';
            }
            update() {
                this.y += speed;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
        }

        function initGame() {
            canvas.width = width;
            canvas.height = height;
            car = new Car();
            obstacles = [];
            gameActive = true;
            speed = 5;
            distance = 0;
            offset = 0;
            gameOverEl.style.display = 'none';
            animate();
        }

        function endGame() {
            gameActive = false;
            gameOverEl.style.display = 'flex';
            document.getElementById('final-distance').textContent = `Distance: ${Math.floor(distance)} M`;
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Draw Road Lines
            ctx.strokeStyle = 'rgba(0, 242, 255, 0.1)';
            ctx.lineWidth = 2;
            offset = (offset + speed) % 80;
            for (let i = -80; i < height; i += 80) {
                ctx.beginPath();
                ctx.moveTo(width / 2, i + offset);
                ctx.lineTo(width / 2, i + offset + 40);
                ctx.stroke();
            }

            // Side lines
            ctx.strokeStyle = 'rgba(0, 242, 255, 0.3)';
            ctx.beginPath();
            ctx.moveTo(20, 0); ctx.lineTo(20, height);
            ctx.moveTo(width - 20, 0); ctx.lineTo(width - 20, height);
            ctx.stroke();

            car.update();
            car.draw();

            if (Math.random() < 0.02) obstacles.push(new Obstacle());

            obstacles.forEach((obs, i) => {
                obs.update();
                obs.draw();

                if (obs.y > height) obstacles.splice(i, 1);

                // Collision Detection
                if (car.x < obs.x + obs.width &&
                    car.x + car.width > obs.x &&
                    car.y < obs.y + obs.height &&
                    car.y + car.height > obs.y) {
                    endGame();
                }
            });

            distance += speed / 10;
            speed += 0.001;
            speedEl.textContent = `${Math.floor(speed * 20)} KM/H`;
            distanceEl.textContent = `${Math.floor(distance)} M`;
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') car.targetX = Math.max(30, car.x - 50);
            if (e.key === 'ArrowRight' || e.key === 'd') car.targetX = Math.min(width - 30 - car.width, car.x + 50);
        });

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            car.targetX = (e.clientX - rect.left) - car.width / 2;
            if (car.targetX < 30) car.targetX = 30;
            if (car.targetX + car.width > width - 30) car.targetX = width - 30 - car.width;
        });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            car.targetX = (e.touches[0].clientX - rect.left) - car.width / 2;
            if (car.targetX < 30) car.targetX = 30;
            if (car.targetX + car.width > width - 30) car.targetX = width - 30 - car.width;
        });

        initGame();
    </script>
</body>
</html>
