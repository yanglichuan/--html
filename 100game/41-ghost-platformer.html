<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Platformer - Game 41/100</title>
    <style>
        :root {
            --bg: #050505;
            --p-blue: #00f2ff;
            --p-pink: #ff007a;
            --p-purple: #bc00ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            background: #000;
            border: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            max-width: 95vw;
            max-height: 80vh;
        }

        .ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 10;
        }

        .stat {
            text-align: center;
            font-family: monospace;
            text-shadow: 0 0 10px var(--p-blue);
        }

        .label { font-size: 10px; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; }
        .value { font-size: 24px; font-weight: 900; color: var(--p-blue); }

        .game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 5, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        h1 {
            font-size: 48px;
            background: linear-gradient(to right, var(--p-pink), var(--p-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 35px;
            background: transparent;
            border: 2px solid var(--p-blue);
            color: var(--p-blue);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--p-blue);
            color: black;
            box-shadow: 0 0 30px var(--p-blue);
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="ui">
        <div class="stat">
            <div class="label">LEVEL</div>
            <div id="level" class="value">1</div>
        </div>
        <div class="stat">
            <div class="label">SYNC</div>
            <div id="sync" class="value">100%</div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="game-over" class="game-over">
        <h1>SYNC FAILED</h1>
        <p id="final-stats" style="font-size: 24px; margin-bottom: 20px;">Level: 1</p>
        <button onclick="initGame()">RE-INIT SYSTEM</button>
    </div>

    <div class="controls-hint">Arrows or WASD to Move & Jump</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const levelEl = document.getElementById('level');
        const gameOverEl = document.getElementById('game-over');

        let width = 800, height = 400;
        let player, platforms, goal, gameActive, level;

        class Player {
            constructor() {
                this.w = 20;
                this.h = 30;
                this.reset();
            }
            reset() {
                this.x = 50;
                this.y = height - 100;
                this.vx = 0;
                this.vy = 0;
                this.gravity = 0.6;
                this.jumpPower = -12;
                this.onGround = false;
            }
            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;

                this.onGround = false;
                platforms.forEach(p => {
                    if (this.vy > 0 && this.x + this.w > p.x && this.x < p.x + p.w &&
                        this.y + this.h > p.y && this.y + this.h < p.y + p.h + this.vy) {
                        this.y = p.y - this.h;
                        this.vy = 0;
                        this.onGround = true;
                    }
                });

                if (this.y > height) endGame();
            }
            draw() {
                ctx.fillStyle = '#00f2ff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#00f2ff';
                ctx.fillRect(this.x, this.y, this.w, this.h);
                
                // Ghost face
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + 4, this.y + 5, 4, 4);
                ctx.fillRect(this.x + 12, this.y + 5, 4, 4);
                ctx.shadowBlur = 0;
            }
        }

        class Platform {
            constructor(x, y, w, h) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
            }
            draw() {
                ctx.fillStyle = '#bc00ff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#bc00ff';
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.shadowBlur = 0;
            }
        }

        function createLevel(lvl) {
            platforms = [
                new Platform(0, height - 20, 200, 20),
                new Platform(250, height - 80, 100, 20),
                new Platform(400, height - 150, 100, 20),
                new Platform(550, height - 220, 150, 20)
            ];
            goal = { x: 650, y: height - 260, radius: 15 };
        }

        function initGame() {
            canvas.width = width;
            canvas.height = height;
            level = 1;
            player = new Player();
            createLevel(level);
            gameActive = true;
            levelEl.textContent = level;
            gameOverEl.style.display = 'none';
            animate();
        }

        function endGame() {
            gameActive = false;
            gameOverEl.style.display = 'flex';
            document.getElementById('final-stats').textContent = `Level: ${level}`;
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            // Goal
            ctx.fillStyle = '#39ff14';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#39ff14';
            ctx.beginPath();
            ctx.arc(goal.x, goal.y, goal.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            player.update();
            player.draw();

            platforms.forEach(p => p.draw());

            if (Math.hypot(player.x + player.w/2 - goal.x, player.y + player.h/2 - goal.y) < goal.radius + 10) {
                level++;
                levelEl.textContent = level;
                player.reset();
                createLevel(level);
            }
        }

        const keys = {};
        window.addEventListener('keydown', e => {
            keys[e.key] = true;
            if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && player.onGround) player.vy = player.jumpPower;
        });
        window.addEventListener('keyup', e => keys[e.key] = false);

        function handleInput() {
            if (!gameActive) return;
            player.vx = 0;
            if (keys['ArrowLeft'] || keys['a']) player.vx = -5;
            if (keys['ArrowRight'] || keys['d']) player.vx = 5;
            requestAnimationFrame(handleInput);
        }
        handleInput();

        initGame();
    </script>
</body>
</html>
