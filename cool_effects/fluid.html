<!DOCTYPE html>
<html>
<head>
    <title>Fluid Simulation</title>
    <style>body { margin: 0; overflow: hidden; background: black; }</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let time = 0;
    
    function draw() {
        const w = canvas.width;
        const h = canvas.height;
        const imageData = ctx.createImageData(w, h);
        const data = imageData.data;
        
        // Low res for performance effect (simulated fluid look)
        // Actually doing a real pixel manipulation is slow in JS without WebGL shaders
        // Let's do a particle based fluid-like approximation
    }
    
    // Switch to Canvas Particle Fluid for better JS performance without complex shader setup
    let particles = [];
    const numParticles = 200;
    
    for(let i=0; i<numParticles; i++){
        particles.push({
            x: Math.random()*canvas.width,
            y: Math.random()*canvas.height,
            vx: (Math.random()-0.5)*2,
            vy: (Math.random()-0.5)*2,
            size: Math.random()*20+10,
            color: `hsl(${Math.random()*360}, 100%, 50%)`
        });
    }
    
    function animate(){
        ctx.fillStyle = 'rgba(0,0,0,0.1)';
        ctx.fillRect(0,0,canvas.width, canvas.height);
        
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            
            if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
            
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fillStyle = p.color;
            ctx.filter = 'blur(10px)'; // The "Fluid" trick
            ctx.fill();
            ctx.filter = 'none';
        });
        
        requestAnimationFrame(animate);
    }
    animate();
</script>
</body>
</html>
