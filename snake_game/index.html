<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫酷贪吃蛇 - HTML5 小游戏</title>
    <style>
        :root { --bg-color:#0b0f1a; --canvas-bg:#0e1730; --snake-head:#35ffd0; --snake-body:#0ef0b7; --food-color:#ff3b6a; --text-color:#eaf7ff }
        body { margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; background:radial-gradient(600px circle at 20% 30%, rgba(53,255,208,0.12), transparent 40%), radial-gradient(600px circle at 80% 70%, rgba(255,59,106,0.10), transparent 45%), linear-gradient(135deg,#0b0f1a,#101a2c,#16213e); background-size:120% 120%; animation:bgMove 20s ease infinite; color:var(--text-color); font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; overflow:hidden }
        @keyframes bgMove { 0%{background-position:0% 0%} 50%{background-position:100% 100%} 100%{background-position:0% 0%} }
        .stats { margin-bottom:20px; display:flex; gap:40px; font-size:1.5rem; font-weight:700; text-shadow:0 0 12px rgba(53,255,208,0.6) }
        .game-container { position:relative; border-radius:16px; box-shadow:0 0 24px rgba(53,255,208,0.35), 0 0 10px rgba(255,255,255,0.06) inset; overflow:hidden }
        canvas { display:block; background:rgba(14,23,48,0.95); backdrop-filter: blur(4px) saturate(1.1) }
        .controls { margin-top:16px; text-align:center; opacity:0.75 }
        .game-over { position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(180deg, rgba(11,15,26,0.85), rgba(11,15,26,0.85)); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:10 }
        .game-over h2 { font-size:3rem; color:var(--food-color); margin-bottom:10px; text-shadow:0 0 16px rgba(255,59,106,0.6) }
        .game-over button { background:var(--snake-head); border:none; padding:12px 30px; font-size:1.2rem; color:#051019; font-weight:800; border-radius:8px; cursor:pointer; transition:transform .2s, filter .2s }
        .game-over button:hover { transform:scale(1.05); filter:brightness(1.1) }
        .game-over button:active { transform:scale(0.95) }
    </style>
</head>
<body>
    <div class="stats">
        <div>分数: <span id="score">0</span></div>
        <div>最高分: <span id="highScore">0</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="520" height="520"></canvas>
        <div id="gameOver" class="game-over">
            <h2>游戏结束</h2>
            <p>最终分数: <span id="finalScore">0</span></p>
            <button onclick="resetGame()">重新开始</button>
        </div>
    </div>

    <div class="controls">
        <p>使用方向键或 WASD 移动蛇</p>
    </div>

    <script>
        const canvas=document.getElementById('gameCanvas'); const ctx=canvas.getContext('2d'); const scoreElement=document.getElementById('score'); const highScoreElement=document.getElementById('highScore'); const gameOverScreen=document.getElementById('gameOver'); const finalScoreElement=document.getElementById('finalScore');
        const gridSize=20; const tileCount=canvas.width/gridSize;
        let score=0; let highScore=localStorage.getItem('snakeHighScore')||0; highScoreElement.textContent=highScore;
        let snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
        let food={x:15,y:15};
        let dx=1, dy=0, nextDx=1, nextDy=0;
        let running=true;
        let step=90;
        let particles=[];
        let prevTs=0;
        let acc=step;
        function outOfBounds(h){ return h.x<0||h.x>=tileCount||h.y<0||h.y>=tileCount }
        function selfHit(){ const h=snake[0]; for(let i=1;i<snake.length;i++){ if(h.x===snake[i].x&&h.y===snake[i].y) return true } return false }
        function handleGameOver(){ running=false; gameOverScreen.style.display='flex'; finalScoreElement.textContent=score; if(score>highScore){ highScore=score; highScoreElement.textContent=highScore; localStorage.setItem('snakeHighScore',highScore) } }
        function generateFood(){ food={ x:Math.floor(Math.random()*tileCount), y:Math.floor(Math.random()*tileCount) }; for(const p of snake){ if(p.x===food.x&&p.y===food.y){ generateFood(); break } } }
        function makeParticles(){ const cx=food.x*gridSize+gridSize/2; const cy=food.y*gridSize+gridSize/2; for(let i=0;i<24;i++){ const a=Math.random()*Math.PI*2; const s=1.2+Math.random()*2.2; particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40,color:i%2===0?'rgba(255,59,106,0.9)':'rgba(53,255,208,0.9)'}) } }
        function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath() }
        function drawGrid(){ ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1; for(let i=1;i<tileCount;i++){ ctx.beginPath(); ctx.moveTo(i*gridSize,0); ctx.lineTo(i*gridSize,canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,i*gridSize); ctx.lineTo(canvas.width,i*gridSize); ctx.stroke() } }
        function drawFood(t){ const cx=food.x*gridSize+gridSize/2; const cy=food.y*gridSize+gridSize/2; const pulse=(Math.sin(t*0.006)+1)*0.5; const r=(gridSize/2-2)*(0.8+0.2*pulse); ctx.save(); ctx.shadowColor='rgba(255,59,106,0.8)'; ctx.shadowBlur=18; ctx.fillStyle='#ff3b6a'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill(); ctx.lineWidth=2; ctx.strokeStyle='rgba(255,59,106,0.6)'; ctx.stroke(); ctx.restore(); ctx.save(); ctx.strokeStyle='rgba(255,59,106,0.25)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(cx,cy,r+6*pulse,0,Math.PI*2); ctx.stroke(); ctx.restore() }
        function segDir(i){ if(i<snake.length-1){ return {x:snake[i].x-snake[i+1].x,y:snake[i].y-snake[i+1].y} } return {x:snake[i-1].x-snake[i].x,y:snake[i-1].y-snake[i].y} }
        function norm(v){ const l=Math.hypot(v.x,v.y)||1; return {x:v.x/l,y:v.y/l} }
        function getPoint(i,t){ const p=snake[i]; const d=norm(segDir(i)); const n={x:-d.y,y:d.x}; const off=Math.sin(t*0.012+i*0.6)*2.2; const cx=p.x*gridSize+gridSize/2+n.x*off; const cy=p.y*gridSize+gridSize/2+n.y*off; return {x:cx,y:cy,dir:d} }
        function drawSnake(t){
            const len=snake.length; const baseR=gridSize*0.45;
            for(let i=len-1;i>=0;i--){
                const info=getPoint(i,t); const r=baseR*(1-i/len*0.45);
                const g=ctx.createRadialGradient(info.x,info.y,r*0.15,info.x,info.y,r);
                if(i===0){ g.addColorStop(0,'#7effe6'); g.addColorStop(1,'#35ffd0') } else { g.addColorStop(0,'#5ff8d5'); g.addColorStop(1,'#0ef0b7') }
                ctx.save(); ctx.shadowBlur=18; ctx.shadowColor=i===0?'rgba(53,255,208,0.9)':'rgba(14,240,183,0.7)'; ctx.fillStyle=g; ctx.beginPath(); ctx.arc(info.x,info.y,r,0,Math.PI*2); ctx.fill(); ctx.restore();
                const ang=Math.atan2(info.dir.y,info.dir.x); ctx.save(); ctx.translate(info.x,info.y); ctx.rotate(ang); ctx.fillStyle='rgba(0,0,0,0.15)'; ctx.fillRect(-r*0.55,-1.1,r*1.1,2.2); ctx.restore()
            }
            const head=getPoint(0,t); const angH=Math.atan2(head.dir.y,head.dir.x); ctx.save(); ctx.translate(head.x,head.y); ctx.rotate(angH); ctx.shadowBlur=20; ctx.shadowColor='rgba(53,255,208,0.95)'; ctx.fillStyle='#35ffd0'; ctx.beginPath(); ctx.ellipse(0,0,baseR+2,baseR-2,0,0,Math.PI*2); ctx.fill(); ctx.restore();
            const n={x:-head.dir.y,y:head.dir.x}; const eyeSep=baseR*0.45; const forward=baseR*0.2; const ex1=head.x+n.x*eyeSep+head.dir.x*forward; const ey1=head.y+n.y*eyeSep+head.dir.y*forward; const ex2=head.x-n.x*eyeSep+head.dir.x*forward; const ey2=head.y-n.y*eyeSep+head.dir.y*forward;
            ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(ex1,ey1,3,0,Math.PI*2); ctx.arc(ex2,ey2,3,0,Math.PI*2); ctx.fill();
            ctx.fillStyle='#021410'; ctx.beginPath(); ctx.arc(ex1+head.dir.x*1.2,ey1+head.dir.y*1.2,1.6,0,Math.PI*2); ctx.arc(ex2+head.dir.x*1.2,ey2+head.dir.y*1.2,1.6,0,Math.PI*2); ctx.fill();
            const tipX=head.x+head.dir.x*(baseR+4); const tipY=head.y+head.dir.y*(baseR+4);
            ctx.strokeStyle='#ff3b6a'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(tipX,tipY); ctx.lineTo(tipX+head.dir.x*7+ n.x*1.5, tipY+head.dir.y*7+ n.y*1.5); ctx.moveTo(tipX,tipY); ctx.lineTo(tipX+head.dir.x*7- n.x*1.5, tipY+head.dir.y*7- n.y*1.5); ctx.stroke()
        }
        function drawParticles(){ const next=[]; for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vx*=0.97; p.vy*=0.97; p.life--; if(p.life>0){ ctx.save(); ctx.globalAlpha=Math.max(0,p.life/40); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,Math.PI*2); ctx.fill(); ctx.restore(); next.push(p) } } particles=next }
        function draw(t){ ctx.fillStyle= '#0e1730'; ctx.fillRect(0,0,canvas.width,canvas.height); drawGrid(); drawFood(t); drawSnake(t); drawParticles() }
        function stepMove(){
            dx=nextDx; dy=nextDy;
            const head={ x:snake[0].x+dx, y:snake[0].y+dy };
            snake.unshift(head);
            const ate=head.x===food.x&&head.y===food.y;
            if(ate){
                score += 10; scoreElement.textContent = score;
                makeParticles(); generateFood();
                if(step>50){ step -= 2 }
            } else {
                snake.pop();
            }
            if(outOfBounds(head)||selfHit()){ handleGameOver() }
        }
        function loop(ts){
            if(!running) return;
            if(prevTs===0) prevTs=ts;
            let dt=ts-prevTs;
            prevTs=ts;
            if(dt>120){ dt=120 }
            acc=Math.min(acc+dt, step*2);
            let moved=0;
            while(acc>=step && moved<2){
                stepMove();
                acc-=step;
                moved++;
                if(!running) break;
            }
            draw(ts);
            requestAnimationFrame(loop)
        }
        function resetGame(){
            snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
            food={x:15,y:15};
            dx=1; dy=0; nextDx=1; nextDy=0;
            score=0; step=90; scoreElement.textContent=score;
            gameOverScreen.style.display='none';
            running=true; prevTs=0; acc=step;
            requestAnimationFrame(loop)
        }
        window.addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); if(k==='arrowup'||k==='w'){ if(dy!==1){ nextDx=0; nextDy=-1 } } else if(k==='arrowdown'||k==='s'){ if(dy!==-1){ nextDx=0; nextDy=1 } } else if(k==='arrowleft'||k==='a'){ if(dx!==1){ nextDx=-1; nextDy=0 } } else if(k==='arrowright'||k==='d'){ if(dx!==-1){ nextDx=1; nextDy=0 } } });
        requestAnimationFrame(loop);
    </script>
</body>
</html>
