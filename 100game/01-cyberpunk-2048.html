<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyberpunk 2048 - Game 01/100</title>
    <style>
        :root {
            --bg-color: #050505;
            --grid-bg: #111111;
            --cell-bg: rgba(255, 255, 255, 0.05);
            --accent-cyan: #00f2ff;
            --accent-pink: #ff007a;
            --text-main: #ffffff;
            --text-dim: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
        }

        .header {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px;
        }

        .title-box h1 {
            font-size: 48px;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(to bottom, var(--accent-cyan), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }

        .score-container {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 15px;
            border-radius: 4px;
            text-align: center;
            min-width: 80px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-label {
            font-size: 10px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-cyan);
        }

        .game-area {
            position: relative;
            width: 400px;
            height: 400px;
            background: var(--grid-bg);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 242, 255, 0.1);
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 15px;
            width: 100%;
            height: 100%;
        }

        .grid-cell {
            background: var(--cell-bg);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .tile-container {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            z-index: 2;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            width: 78.75px; /* (400 - 30 - 45) / 4 */
            height: 78.75px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            transition: transform 100ms ease-in-out, opacity 100ms ease-in-out;
            z-index: 10;
        }

        /* Tile Colors & Glows */
        .tile-2 { background: rgba(0, 242, 255, 0.1); color: var(--accent-cyan); box-shadow: 0 0 15px rgba(0, 242, 255, 0.2); border: 1px solid var(--accent-cyan); }
        .tile-4 { background: rgba(0, 242, 255, 0.2); color: var(--accent-cyan); box-shadow: 0 0 20px rgba(0, 242, 255, 0.3); border: 1px solid var(--accent-cyan); }
        .tile-8 { background: rgba(255, 0, 122, 0.1); color: var(--accent-pink); box-shadow: 0 0 15px rgba(255, 0, 122, 0.2); border: 1px solid var(--accent-pink); }
        .tile-16 { background: rgba(255, 0, 122, 0.2); color: var(--accent-pink); box-shadow: 0 0 20px rgba(255, 0, 122, 0.3); border: 1px solid var(--accent-pink); }
        .tile-32 { background: rgba(188, 0, 255, 0.2); color: #bc00ff; box-shadow: 0 0 20px rgba(188, 0, 255, 0.3); border: 1px solid #bc00ff; }
        .tile-64 { background: rgba(188, 0, 255, 0.3); color: #bc00ff; box-shadow: 0 0 25px rgba(188, 0, 255, 0.4); border: 1px solid #bc00ff; }
        .tile-128 { background: rgba(255, 214, 0, 0.2); color: #ffd600; box-shadow: 0 0 20px rgba(255, 214, 0, 0.3); border: 1px solid #ffd600; font-size: 28px; }
        .tile-256 { background: rgba(255, 214, 0, 0.3); color: #ffd600; box-shadow: 0 0 30px rgba(255, 214, 0, 0.5); border: 1px solid #ffd600; font-size: 28px; }
        .tile-512 { background: rgba(0, 255, 133, 0.2); color: #00ff85; box-shadow: 0 0 25px rgba(0, 255, 133, 0.3); border: 1px solid #00ff85; font-size: 28px; }
        .tile-1024 { background: rgba(0, 255, 133, 0.3); color: #00ff85; box-shadow: 0 0 35px rgba(0, 255, 133, 0.5); border: 1px solid #00ff85; font-size: 24px; }
        .tile-2048 { background: #ffffff; color: #000000; box-shadow: 0 0 50px #ffffff, 0 0 20px var(--accent-cyan); font-size: 24px; }

        .tile-new { animation: appear 200ms ease-out; }
        .tile-merged { animation: pop 200ms ease-in-out; }

        @keyframes appear {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .btn-reset {
            margin-top: 15px;
            background: transparent;
            border: 1px solid var(--accent-cyan);
            color: var(--accent-cyan);
            padding: 10px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: rgba(0, 242, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .game-over h2 {
            font-size: 40px;
            margin-bottom: 20px;
            color: var(--accent-pink);
            text-shadow: 0 0 20px rgba(255, 0, 122, 0.5);
        }

        @media (max-width: 420px) {
            .game-area { width: 320px; height: 320px; padding: 10px; }
            .grid-container { gap: 10px; }
            .header { max-width: 320px; padding: 10px; }
            .tile { width: 67.5px; height: 67.5px; font-size: 24px; }
            .tile-container { top: 10px; left: 10px; right: 10px; bottom: 10px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title-box">
            <h1>2048</h1>
        </div>
        <div class="score-container">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div id="score" class="score-value">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Best</div>
                <div id="best-score" class="score-value">0</div>
            </div>
        </div>
    </div>

    <div class="game-area">
        <div class="grid-container">
            <!-- 16 cells -->
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
        <div id="tile-container" class="tile-container"></div>
        <div id="game-over" class="game-over">
            <h2>GAME OVER</h2>
            <button class="btn-reset" onclick="game.init()">Try Again</button>
        </div>
    </div>

    <div class="footer">
        <p>Swipe or use arrow keys to merge tiles</p>
        <button class="btn-reset" onclick="game.init()">New Game</button>
    </div>

    <script>
        class Game2048 {
            constructor() {
                this.container = document.getElementById('tile-container');
                this.scoreEl = document.getElementById('score');
                this.bestEl = document.getElementById('best-score');
                this.gameOverEl = document.getElementById('game-over');
                this.size = 4;
                this.bestScore = parseInt(localStorage.getItem('2048-best')) || 0;
                this.bestEl.textContent = this.bestScore;
                this.init();
                this.setupInputs();
            }

            init() {
                this.grid = Array(this.size).fill().map(() => Array(this.size).fill(0));
                this.score = 0;
                this.updateScore();
                this.gameOverEl.style.display = 'none';
                this.container.innerHTML = '';
                this.addRandomTile();
                this.addRandomTile();
                this.render();
            }

            addRandomTile() {
                const emptyCells = [];
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c] === 0) emptyCells.push({r, c});
                    }
                }
                if (emptyCells.length > 0) {
                    const {r, c} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    this.grid[r][c] = Math.random() < 0.9 ? 2 : 4;
                    return true;
                }
                return false;
            }

            render() {
                this.container.innerHTML = '';
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        const val = this.grid[r][c];
                        if (val !== 0) {
                            const tile = document.createElement('div');
                            tile.className = `tile tile-${val}`;
                            tile.textContent = val;
                            this.positionTile(tile, r, c);
                            this.container.appendChild(tile);
                        }
                    }
                }
            }

            positionTile(tile, r, c) {
                const step = 100 / this.size;
                tile.style.top = `${r * step}%`;
                tile.style.left = `${c * step}%`;
                // Precise sizing adjustment to match grid gaps
                const padding = 15;
                const areaSize = this.container.offsetWidth;
                const cellSize = (areaSize - (this.size + 1) * padding) / this.size;
                tile.style.width = `${cellSize}px`;
                tile.style.height = `${cellSize}px`;
                tile.style.transform = `translate(${c * padding}px, ${r * padding}px)`;
            }

            updateScore() {
                this.scoreEl.textContent = this.score;
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    this.bestEl.textContent = this.bestScore;
                    localStorage.setItem('2048-best', this.bestScore);
                }
            }

            move(direction) {
                // 0: up, 1: right, 2: down, 3: left
                let moved = false;
                const rotatedGrid = this.getRotatedGrid(direction);

                for (let r = 0; r < this.size; r++) {
                    let row = rotatedGrid[r].filter(v => v !== 0);
                    for (let i = 0; i < row.length - 1; i++) {
                        if (row[i] === row[i+1]) {
                            row[i] *= 2;
                            this.score += row[i];
                            row.splice(i+1, 1);
                            moved = true;
                        }
                    }
                    while (row.length < this.size) row.push(0);
                    if (JSON.stringify(rotatedGrid[r]) !== JSON.stringify(row)) moved = true;
                    rotatedGrid[r] = row;
                }

                this.grid = this.setRotatedGrid(rotatedGrid, direction);

                if (moved) {
                    this.addRandomTile();
                    this.updateScore();
                    this.render();
                    if (this.isGameOver()) {
                        this.gameOverEl.style.display = 'flex';
                    }
                }
            }

            getRotatedGrid(dir) {
                let newGrid = JSON.parse(JSON.stringify(this.grid));
                if (dir === 1) return newGrid.map(row => row.reverse()); // right
                if (dir === 2) return this.transpose(newGrid).map(row => row.reverse()); // down
                if (dir === 0) return this.transpose(newGrid); // up
                return newGrid; // left
            }

            setRotatedGrid(grid, dir) {
                if (dir === 1) return grid.map(row => row.reverse());
                if (dir === 2) return this.transpose(grid.map(row => row.reverse()));
                if (dir === 0) return this.transpose(grid);
                return grid;
            }

            transpose(grid) {
                return grid[0].map((_, i) => grid.map(row => row[i]));
            }

            isGameOver() {
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c] === 0) return false;
                        if (c < this.size - 1 && this.grid[r][c] === this.grid[r][c+1]) return false;
                        if (r < this.size - 1 && this.grid[r][c] === this.grid[r+1][c]) return false;
                    }
                }
                return true;
            }

            setupInputs() {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowUp') this.move(0);
                    if (e.key === 'ArrowRight') this.move(1);
                    if (e.key === 'ArrowDown') this.move(2);
                    if (e.key === 'ArrowLeft') this.move(3);
                });

                let touchStartX, touchStartY;
                document.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                });

                document.addEventListener('touchend', (e) => {
                    if (!touchStartX || !touchStartY) return;
                    const dx = e.changedTouches[0].clientX - touchStartX;
                    const dy = e.changedTouches[0].clientY - touchStartY;
                    if (Math.abs(dx) > Math.abs(dy)) {
                        if (Math.abs(dx) > 30) this.move(dx > 0 ? 1 : 3);
                    } else {
                        if (Math.abs(dy) > 30) this.move(dy > 0 ? 2 : 0);
                    }
                    touchStartX = null;
                    touchStartY = null;
                });
            }
        }

        const game = new Game2048();
        // Force initial resize for positioning
        window.dispatchEvent(new Event('resize'));
    </script>
</body>
</html>
