<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Typing - Game 13/100</title>
    <style>
        :root {
            --bg: #050505;
            --p-green: #39ff14;
            --p-blue: #00f2ff;
            --p-pink: #ff007a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            background: #000;
            border: 1px solid rgba(57, 255, 20, 0.2);
            box-shadow: 0 0 50px rgba(57, 255, 20, 0.1);
            max-width: 95vw;
            max-height: 80vh;
        }

        .ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 10;
        }

        .stat {
            text-align: center;
            text-shadow: 0 0 10px var(--p-green);
        }

        .label { font-size: 10px; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; }
        .value { font-size: 24px; font-weight: 900; color: var(--p-green); }

        .game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 5, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        h1 {
            font-size: 48px;
            color: var(--p-green);
            margin-bottom: 20px;
            text-shadow: 0 0 20px var(--p-green);
        }

        button {
            padding: 12px 35px;
            background: transparent;
            border: 2px solid var(--p-green);
            color: var(--p-green);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
            font-family: inherit;
        }

        button:hover {
            background: var(--p-green);
            color: black;
            box-shadow: 0 0 30px var(--p-green);
        }

        .input-hint {
            position: absolute;
            bottom: 20px;
            color: rgba(57, 255, 20, 0.4);
            font-size: 14px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="ui">
        <div class="stat">
            <div class="label">DATA SECURED</div>
            <div id="score" class="value">0</div>
        </div>
        <div class="stat">
            <div class="label">SYSTEM HEALTH</div>
            <div id="health" class="value">100%</div>
        </div>
        <div class="stat">
            <div class="label">WPM</div>
            <div id="wpm" class="value">0</div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="game-over" class="game-over">
        <h1>ACCESS DENIED</h1>
        <p id="final-score" style="font-size: 24px; margin-bottom: 20px; color: var(--p-green);">Score: 0</p>
        <button onclick="initGame()">RE-AUTHORIZE</button>
    </div>

    <div class="input-hint">TYPE THE FALLING WORDS</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const healthEl = document.getElementById('health');
        const wpmEl = document.getElementById('wpm');
        const gameOverEl = document.getElementById('game-over');

        let width = 800, height = 600;
        let words, score, health, gameActive, startTime, totalWordsTyped;
        
        const WORDS = ["CYBER", "MATRIX", "SYSTEM", "HACK", "ACCESS", "DATA", "VOID", "NODE", "SIGNAL", "CORE", "PULSE", "BINARY", "ENCRYPT", "DECODE", "PORTAL", "NEON", "GLITCH", "SYNTH", "VECTOR", "ROUTER"];

        class Word {
            constructor() {
                this.text = WORDS[Math.floor(Math.random() * WORDS.length)];
                this.x = Math.random() * (width - 100) + 50;
                this.y = -20;
                this.speed = 1 + Math.random() * 2 + (score / 1000);
                this.typed = "";
            }
            update() {
                this.y += this.speed;
                if (this.y > height) {
                    health -= 10;
                    healthEl.textContent = `${health}%`;
                    if (health <= 0) endGame();
                    return true;
                }
                return false;
            }
            draw() {
                ctx.font = "bold 20px Courier New";
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#39ff14";
                
                // Background text
                ctx.fillStyle = "rgba(57, 255, 20, 0.3)";
                ctx.fillText(this.text, this.x, this.y);
                
                // Typed text
                ctx.fillStyle = "#39ff14";
                ctx.fillText(this.typed, this.x, this.y);
                ctx.shadowBlur = 0;
            }
        }

        function initGame() {
            canvas.width = width;
            canvas.height = height;
            words = [];
            score = 0;
            health = 100;
            totalWordsTyped = 0;
            startTime = Date.now();
            gameActive = true;
            scoreEl.textContent = '0';
            healthEl.textContent = '100%';
            wpmEl.textContent = '0';
            gameOverEl.style.display = 'none';
            spawnWord();
            animate();
        }

        function spawnWord() {
            if (!gameActive) return;
            words.push(new Word());
            setTimeout(spawnWord, Math.max(500, 2000 - (score / 10)));
        }

        function endGame() {
            gameActive = false;
            gameOverEl.style.display = 'flex';
            document.getElementById('final-score').textContent = `Score: ${score}`;
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);
            ctx.fillStyle = "rgba(5, 5, 5, 0.2)";
            ctx.fillRect(0, 0, width, height);

            // Matrix rain effect
            ctx.fillStyle = "rgba(57, 255, 20, 0.05)";
            for(let i=0; i<20; i++) {
                ctx.fillText(Math.random() > 0.5 ? "1" : "0", Math.random() * width, Math.random() * height);
            }

            words.forEach((word, i) => {
                if (word.update()) words.splice(i, 1);
                else word.draw();
            });

            // Update WPM
            const elapsedMins = (Date.now() - startTime) / 60000;
            wpmEl.textContent = Math.floor(totalWordsTyped / elapsedMins) || 0;
        }

        window.addEventListener('keydown', e => {
            if (!gameActive) return;
            const char = e.key.toUpperCase();
            if (char.length !== 1) return;

            for (let i = 0; i < words.length; i++) {
                const word = words[i];
                if (word.text[word.typed.length] === char) {
                    word.typed += char;
                    if (word.typed === word.text) {
                        score += word.text.length * 10;
                        scoreEl.textContent = score;
                        totalWordsTyped++;
                        words.splice(i, 1);
                    }
                    break;
                }
            }
        });

        initGame();
    </script>
</body>
</html>
