<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghost Minesweeper - Game 04/100</title>
    <style>
        :root {
            --bg: #08080c;
            --cell-bg: #12121a;
            --cell-hover: #1a1a25;
            --ghost-blue: #00f2ff;
            --mine-pink: #ff007a;
            --text: #e0e0e0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            letter-spacing: 4px;
            background: linear-gradient(to right, var(--ghost-blue), #bc00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 14px;
            color: var(--ghost-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(10, 35px);
            grid-template-rows: repeat(10, 35px);
            gap: 4px;
            background: rgba(255, 255, 255, 0.02);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(0, 242, 255, 0.1);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .cell {
            width: 35px;
            height: 35px;
            background: var(--cell-bg);
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .cell:hover {
            background: var(--cell-hover);
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.1);
        }

        .cell.revealed {
            background: #050508;
            cursor: default;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .cell.mine {
            background: rgba(255, 0, 122, 0.2);
            color: var(--mine-pink);
            text-shadow: 0 0 10px var(--mine-pink);
        }

        .cell.flagged::after {
            content: '▲';
            color: var(--mine-pink);
            font-size: 12px;
            text-shadow: 0 0 8px var(--mine-pink);
        }

        .n1 { color: #00f2ff; }
        .n2 { color: #00ff85; }
        .n3 { color: #ff007a; }
        .n4 { color: #bc00ff; }
        .n5 { color: #ffd600; }

        .game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 8, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            background: transparent;
            border: 1px solid var(--ghost-blue);
            color: var(--ghost-blue);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            border-radius: 4px;
        }

        button:hover {
            background: rgba(0, 242, 255, 0.1);
            box-shadow: 0 0 20px var(--ghost-blue);
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        .mine-hit {
            animation: glitch 0.2s infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>GHOST MINES</h1>
        <div class="stats">
            <div>Mines: <span id="mine-count">10</span></div>
            <div>Time: <span id="timer">000</span></div>
        </div>
    </div>

    <div id="grid"></div>

    <div id="game-overlay" class="game-over">
        <h2 id="status-text" style="font-size: 40px; margin-bottom: 10px;">SYSTEM FAILURE</h2>
        <p id="time-result">Final Time: 0s</p>
        <button onclick="initGame()">REBOOT</button>
    </div>

    <script>
        const size = 10;
        const mineCount = 12;
        let grid = [];
        let revealedCount = 0;
        let gameOver = false;
        let timer = 0;
        let timerInterval;

        const gridEl = document.getElementById('grid');
        const mineCountEl = document.getElementById('mine-count');
        const timerEl = document.getElementById('timer');
        const overlay = document.getElementById('game-overlay');
        const statusText = document.getElementById('status-text');

        function initGame() {
            grid = [];
            revealedCount = 0;
            gameOver = false;
            timer = 0;
            clearInterval(timerInterval);
            timerEl.textContent = '000';
            mineCountEl.textContent = mineCount;
            overlay.style.display = 'none';
            gridEl.innerHTML = '';
            gridEl.classList.remove('mine-hit');

            // Create cells
            for (let r = 0; r < size; r++) {
                grid[r] = [];
                for (let c = 0; c < size; c++) {
                    const el = document.createElement('div');
                    el.className = 'cell';
                    el.dataset.r = r;
                    el.dataset.c = c;
                    
                    el.onclick = () => reveal(r, c);
                    el.oncontextmenu = (e) => {
                        e.preventDefault();
                        toggleFlag(r, c);
                    };

                    gridEl.appendChild(el);
                    grid[r][c] = {
                        mine: false,
                        revealed: false,
                        flagged: false,
                        neighborMines: 0,
                        el: el
                    };
                }
            }

            // Place mines
            let placed = 0;
            while (placed < mineCount) {
                const r = Math.floor(Math.random() * size);
                const c = Math.floor(Math.random() * size);
                if (!grid[r][c].mine) {
                    grid[r][c].mine = true;
                    placed++;
                }
            }

            // Calculate neighbors
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (grid[r][c].mine) continue;
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = r + dr, nc = c + dc;
                            if (nr >= 0 && nr < size && nc >= 0 && nc < size && grid[nr][nc].mine) {
                                count++;
                            }
                        }
                    }
                    grid[r][c].neighborMines = count;
                }
            }

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                timerEl.textContent = String(timer).padStart(3, '0');
            }, 1000);
        }

        function toggleFlag(r, c) {
            if (gameOver || grid[r][c].revealed) return;
            grid[r][c].flagged = !grid[r][c].flagged;
            grid[r][c].el.classList.toggle('flagged');
            
            const flaggedCount = document.querySelectorAll('.cell.flagged').length;
            mineCountEl.textContent = Math.max(0, mineCount - flaggedCount);
        }

        function reveal(r, c) {
            if (gameOver || grid[r][c].revealed || grid[r][c].flagged) return;

            const cell = grid[r][c];
            cell.revealed = true;
            cell.el.classList.add('revealed');
            revealedCount++;

            if (cell.mine) {
                endGame(false);
                return;
            }

            if (cell.neighborMines > 0) {
                cell.el.textContent = cell.neighborMines;
                cell.el.classList.add('n' + cell.neighborMines);
            } else {
                // Auto reveal neighbors
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
                            reveal(nr, nc);
                        }
                    }
                }
            }

            if (revealedCount === size * size - mineCount) {
                endGame(true);
            }
        }

        function endGame(win) {
            gameOver = true;
            clearInterval(timerInterval);
            
            if (!win) {
                gridEl.classList.add('mine-hit');
                // Reveal all mines
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        if (grid[r][c].mine) {
                            grid[r][c].el.classList.add('revealed', 'mine');
                            grid[r][c].el.textContent = '☢';
                        }
                    }
                }
                statusText.textContent = 'SYSTEM FAILURE';
                statusText.style.color = '#ff007a';
            } else {
                statusText.textContent = 'DATA SECURED';
                statusText.style.color = '#00f2ff';
            }

            document.getElementById('time-result').textContent = `Final Time: ${timer}s`;
            setTimeout(() => {
                overlay.style.display = 'flex';
            }, 1000);
        }

        initGame();
    </script>
</body>
</html>
