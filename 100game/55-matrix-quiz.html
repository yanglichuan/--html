<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>矩阵问答 - Matrix Quiz</title>
    <style>
        :root {
            --bg-color: #000;
            --matrix-green: #00ff41;
            --matrix-dark: #003b00;
            --text-color: #e0e0e0;
            --highlight: #fff;
            --error: #ff0000;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Courier New', Courier, monospace;
            color: var(--matrix-green);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #matrix-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.2;
        }

        #quiz-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--matrix-green);
            box-shadow: 0 0 20px var(--matrix-dark);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--matrix-green);
            padding-bottom: 10px;
        }

        #score-display {
            font-size: 24px;
            font-weight: bold;
        }

        #timer-display {
            font-size: 24px;
            color: var(--highlight);
        }

        #question-area {
            min-height: 100px;
            font-size: 18px;
            line-height: 1.5;
            text-shadow: 0 0 5px var(--matrix-green);
        }

        #options-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            background: rgba(0, 59, 0, 0.3);
            border: 1px solid var(--matrix-green);
            color: var(--matrix-green);
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover {
            background: var(--matrix-green);
            color: #000;
        }

        .option-btn.correct {
            background: var(--matrix-green);
            color: #000;
            border-color: var(--highlight);
            box-shadow: 0 0 15px var(--matrix-green);
        }

        .option-btn.wrong {
            background: var(--error);
            border-color: var(--error);
            color: #fff;
        }

        #result-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            display: none;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        button.restart-btn {
            background: transparent;
            border: 2px solid var(--matrix-green);
            color: var(--matrix-green);
            padding: 15px 40px;
            font-size: 24px;
            cursor: pointer;
            margin-top: 20px;
        }

        button.restart-btn:hover {
            background: var(--matrix-green);
            color: #000;
        }

    </style>
</head>
<body>
    <canvas id="matrix-bg"></canvas>
    
    <div id="quiz-container">
        <div id="header">
            <span id="score-display">SCORE: 0</span>
            <span id="timer-display">30</span>
        </div>

        <div id="question-area">Loading system data...</div>
        
        <div id="options-area">
            <!-- Options generated by JS -->
        </div>
    </div>

    <div id="result-modal">
        <h1 id="result-title">SYSTEM HALTED</h1>
        <p style="font-size: 24px;">Final Score: <span id="final-score">0</span></p>
        <button class="restart-btn" onclick="startQuiz()">REBOOT</button>
    </div>

    <script>
        // Matrix Rain
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        let width, height;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const chars = "01";
        const drops = [];
        const fontSize = 14;
        const columns = width / fontSize;

        for (let i = 0; i < columns; i++) drops[i] = 1;

        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = "#0F0";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
            requestAnimationFrame(drawMatrix);
        }
        drawMatrix();

        // Quiz Logic
        const QUESTIONS = [
            {
                q: "Which protocol is used for secure communication over a computer network?",
                options: ["HTTP", "FTP", "HTTPS", "SMTP"],
                answer: 2
            },
            {
                q: "What does HTML stand for?",
                options: ["Hyper Text Markup Language", "High Tech Multi Language", "Hyperlink and Text Markup Language", "Home Tool Markup Language"],
                answer: 0
            },
            {
                q: "In the Matrix movie, which pill does Neo take?",
                options: ["Blue", "Red", "Green", "Yellow"],
                answer: 1
            },
            {
                q: "What is the binary representation of decimal 5?",
                options: ["101", "110", "111", "100"],
                answer: 0
            },
            {
                q: "Which programming language is known as the language of the web?",
                options: ["Java", "Python", "JavaScript", "C++"],
                answer: 2
            },
            {
                q: "What does CSS stand for?",
                options: ["Creative Style Sheets", "Cascading Style Sheets", "Computer Style Sheets", "Colorful Style Sheets"],
                answer: 1
            },
            {
                q: "What is the main component of a computer that performs calculations?",
                options: ["RAM", "HDD", "CPU", "GPU"],
                answer: 2
            },
            {
                q: "Which company developed the Windows operating system?",
                options: ["Apple", "Google", "IBM", "Microsoft"],
                answer: 3
            },
            {
                q: "What is the term for a malicious software that replicates itself?",
                options: ["Bug", "Virus", "Glitch", "Feature"],
                answer: 1
            },
            {
                q: "In cyberpunk culture, what is a 'deck'?",
                options: ["A skateboard", "A computer terminal", "A card game", "A spaceship"],
                answer: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let timeLeft = 30;
        let timerInterval;
        let isAnswering = false;

        const questionEl = document.getElementById('question-area');
        const optionsEl = document.getElementById('options-area');
        const scoreEl = document.getElementById('score-display');
        const timerEl = document.getElementById('timer-display');
        const modal = document.getElementById('result-modal');
        const finalScoreEl = document.getElementById('final-score');
        const resultTitle = document.getElementById('result-title');

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            scoreEl.textContent = `SCORE: ${score}`;
            modal.style.display = 'none';
            shuffleQuestions();
            loadQuestion();
        }

        function shuffleQuestions() {
            for (let i = QUESTIONS.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [QUESTIONS[i], QUESTIONS[j]] = [QUESTIONS[j], QUESTIONS[i]];
            }
        }

        function loadQuestion() {
            if (currentQuestionIndex >= QUESTIONS.length) {
                endQuiz(true);
                return;
            }

            const q = QUESTIONS[currentQuestionIndex];
            questionEl.textContent = q.q;
            optionsEl.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = opt;
                btn.onclick = () => handleAnswer(index);
                optionsEl.appendChild(btn);
            });

            isAnswering = false;
            resetTimer();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timeLeft = 15; // 15 seconds per question
            timerEl.textContent = timeLeft;
            timerInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;
                if (timeLeft <= 0) {
                    handleAnswer(-1); // Time out
                }
            }, 1000);
        }

        function handleAnswer(selectedIndex) {
            if (isAnswering) return;
            isAnswering = true;
            clearInterval(timerInterval);

            const q = QUESTIONS[currentQuestionIndex];
            const buttons = optionsEl.querySelectorAll('.option-btn');
            
            if (selectedIndex === q.answer) {
                buttons[selectedIndex].classList.add('correct');
                score += 10 + timeLeft; // Bonus for speed
                scoreEl.textContent = `SCORE: ${score}`;
                setTimeout(() => {
                    currentQuestionIndex++;
                    loadQuestion();
                }, 1000);
            } else {
                if (selectedIndex !== -1) {
                    buttons[selectedIndex].classList.add('wrong');
                }
                buttons[q.answer].classList.add('correct'); // Show correct answer
                setTimeout(() => {
                    endQuiz(false);
                }, 1500);
            }
        }

        function endQuiz(completed) {
            clearInterval(timerInterval);
            resultTitle.textContent = completed ? "SYSTEM SECURE" : "SYSTEM BREACHED";
            resultTitle.style.color = completed ? "var(--matrix-green)" : "var(--error)";
            finalScoreEl.textContent = score;
            modal.style.display = 'flex';
        }

        // Start
        startQuiz();

    </script>
</body>
</html>
