<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Demo - Three.js</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            z-index: 100;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #info h2 {
            margin-bottom: 10px;
            font-size: 18px;
            color: #4cc9f0;
        }
        
        #info p {
            margin: 5px 0;
            line-height: 1.6;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.5);
            padding: 15px 25px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }
        
        button {
            background: linear-gradient(135deg, #4cc9f0 0%, #4361ee 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }

        button#reset {
            background: linear-gradient(135deg, #f72585 0%, #b5179e 100%);
        }
        
        button#reset:hover {
            box-shadow: 0 5px 15px rgba(247, 37, 133, 0.4);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="info">
        <h2>🎮 3D 交互演示</h2>
        <p>🖱️ 左键拖拽：旋转视角</p>
        <p>👆 右键拖拽：平移视角</p>
        <p>🔍 滚轮：缩放场景</p>
        <p>✨ 点击物体：改变颜色与交互</p>
    </div>
    
    <div id="controls">
        <button id="addCube">添加立方体</button>
        <button id="addSphere">添加球体</button>
        <button id="addTorus">添加圆环</button>
        <button id="reset">重置场景</button>
    </div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, controls;
        let objects = [];
        let raycaster, mouse;
        
        function init() {
            // 场景设置
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.Fog(0x1a1a2e, 20, 100);
            
            // 相机设置
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(5, 5, 10);
            
            // 渲染器设置
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // 控制器设置
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 5;
            controls.maxDistance = 50;
            controls.maxPolarAngle = Math.PI / 2; // 限制相机不能穿过地面
            
            // 交互设置
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            addLights();
            addFloor();
            addGrid();
            addInitialObjects();
            
            setupEventListeners();
            
            animate();
        }
        
        function addLights() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            // 主光源
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 50;
            directionalLight.shadow.camera.left = -20;
            directionalLight.shadow.camera.right = 20;
            directionalLight.shadow.camera.top = 20;
            directionalLight.shadow.camera.bottom = -20;
            scene.add(directionalLight);
            
            // 点光源装饰
            const pointLight1 = new THREE.PointLight(0x4cc9f0, 2, 50);
            pointLight1.position.set(-10, 5, -10);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0xf72585, 2, 50);
            pointLight2.position.set(10, 5, 10);
            scene.add(pointLight2);
        }
        
        function addFloor() {
            const geometry = new THREE.PlaneGeometry(100, 100);
            const material = new THREE.MeshStandardMaterial({
                color: 0x2a2a3e,
                roughness: 0.8,
                metalness: 0.2
            });
            const floor = new THREE.Mesh(geometry, material);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -2;
            floor.receiveShadow = true;
            scene.add(floor);
        }

        function addGrid() {
            const gridHelper = new THREE.GridHelper(100, 100, 0x4cc9f0, 0x2a2a3e);
            gridHelper.position.y = -1.99;
            gridHelper.material.opacity = 0.2;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
        }
        
        function addInitialObjects() {
            addCube(0, 0, 0);
            addSphere(-4, 1, 0);
            addTorus(4, 1, 0);
        }
        
        function getRandomColor() {
            const colors = [0x4cc9f0, 0x4361ee, 0x3a0ca3, 0x7209b7, 0xf72585];
            return colors[Math.floor(Math.random() * colors.length)];
        }

        function createMaterial() {
            return new THREE.MeshStandardMaterial({
                color: getRandomColor(),
                roughness: 0.3,
                metalness: 0.7,
                emissive: 0x000000,
                emissiveIntensity: 0.2
            });
        }
        
        function addCube(x, y, z) {
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = createMaterial();
            const cube = new THREE.Mesh(geometry, material);
            
            setPosition(cube, x, y, z);
            
            cube.castShadow = true;
            cube.receiveShadow = true;
            cube.userData = { 
                rotationSpeed: {
                    x: (Math.random() - 0.5) * 0.02,
                    y: (Math.random() - 0.5) * 0.02
                },
                floatSpeed: Math.random() * 0.02 + 0.01,
                floatOffset: Math.random() * Math.PI * 2,
                originalY: cube.position.y
            };
            
            scene.add(cube);
            objects.push(cube);
            
            animateEntry(cube);
        }
        
        function addSphere(x, y, z) {
            const geometry = new THREE.SphereGeometry(1.2, 32, 32);
            const material = createMaterial();
            const sphere = new THREE.Mesh(geometry, material);
            
            setPosition(sphere, x, y, z);
            
            sphere.castShadow = true;
            sphere.receiveShadow = true;
            sphere.userData = { 
                rotationSpeed: {
                    x: (Math.random() - 0.5) * 0.02,
                    y: (Math.random() - 0.5) * 0.02
                },
                floatSpeed: Math.random() * 0.02 + 0.01,
                floatOffset: Math.random() * Math.PI * 2,
                originalY: sphere.position.y
            };
            
            scene.add(sphere);
            objects.push(sphere);
            
            animateEntry(sphere);
        }
        
        function addTorus(x, y, z) {
            const geometry = new THREE.TorusGeometry(1, 0.4, 16, 100);
            const material = createMaterial();
            const torus = new THREE.Mesh(geometry, material);
            
            setPosition(torus, x, y, z);
            
            torus.castShadow = true;
            torus.receiveShadow = true;
            torus.userData = { 
                rotationSpeed: {
                    x: (Math.random() - 0.5) * 0.02,
                    y: (Math.random() - 0.5) * 0.02
                },
                floatSpeed: Math.random() * 0.02 + 0.01,
                floatOffset: Math.random() * Math.PI * 2,
                originalY: torus.position.y
            };
            
            scene.add(torus);
            objects.push(torus);
            
            animateEntry(torus);
        }

        function setPosition(mesh, x, y, z) {
            if (x !== undefined && y !== undefined && z !== undefined) {
                mesh.position.set(x, y, z);
            } else {
                mesh.position.set(
                    (Math.random() - 0.5) * 20,
                    Math.random() * 5,
                    (Math.random() - 0.5) * 20
                );
            }
            // Ensure object is above floor
            if (mesh.position.y < 0) mesh.position.y = Math.abs(mesh.position.y);
            mesh.userData.originalY = mesh.position.y;
        }

        function animateEntry(mesh) {
            mesh.scale.set(0, 0, 0);
            let scale = 0;
            const targetScale = 1;
            
            function grow() {
                if (scale < targetScale) {
                    scale += 0.05;
                    mesh.scale.set(scale, scale, scale);
                    requestAnimationFrame(grow);
                } else {
                    mesh.scale.set(targetScale, targetScale, targetScale);
                }
            }
            grow();
        }
        
        function resetScene() {
            // Remove all objects except lights and floor/grid
            objects.forEach(obj => {
                // Shrink animation before removing
                let scale = 1;
                function shrink() {
                    if (scale > 0) {
                        scale -= 0.1;
                        obj.scale.set(scale, scale, scale);
                        requestAnimationFrame(shrink);
                    } else {
                        scene.remove(obj);
                    }
                }
                shrink();
            });
            objects = [];
            
            setTimeout(() => {
                addInitialObjects();
            }, 500);
        }
        
        function setupEventListeners() {
            document.getElementById('addCube').addEventListener('click', () => addCube());
            document.getElementById('addSphere').addEventListener('click', () => addSphere());
            document.getElementById('addTorus').addEventListener('click', () => addTorus());
            document.getElementById('reset').addEventListener('click', resetScene);
            
            renderer.domElement.addEventListener('click', onObjectClick);
            renderer.domElement.addEventListener('mousemove', onMouseMove);
            
            window.addEventListener('resize', onWindowResize);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);

            if (intersects.length > 0) {
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
        }
        
        function onObjectClick(event) {
            // Recalculate mouse position just in case
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(objects);
            
            if (intersects.length > 0) {
                const object = intersects[0].object;
                
                // Change color
                const newColor = getRandomColor();
                object.material.color.setHex(newColor);
                object.material.emissive.setHex(newColor);
                object.material.emissiveIntensity = 0.5;
                
                setTimeout(() => {
                    object.material.emissiveIntensity = 0.2;
                }, 300);
                
                // Jump animation
                const startY = object.position.y;
                const jumpHeight = 2;
                let jumpProgress = 0;
                
                function jump() {
                    if (jumpProgress < Math.PI) {
                        jumpProgress += 0.1;
                        object.position.y = startY + Math.sin(jumpProgress) * jumpHeight;
                        requestAnimationFrame(jump);
                    } else {
                        object.position.y = startY;
                    }
                }
                jump();
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001;
            
            objects.forEach(obj => {
                // Rotate
                obj.rotation.x += obj.userData.rotationSpeed.x;
                obj.rotation.y += obj.userData.rotationSpeed.y;
                
                // Float
                if (obj.userData.floatSpeed) {
                    obj.position.y = obj.userData.originalY + Math.sin(time * obj.userData.floatSpeed * 100 + obj.userData.floatOffset) * 0.5;
                }
            });
            
            if (controls) controls.update();
            
            renderer.render(scene, camera);
        }
        
        init();
    </script>
</body>
</html>
