<!DOCTYPE html>
<html>
<head>
    <title>Fractal</title>
    <style>body { margin: 0; background: #000; overflow: hidden; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let shift = 0;

    function draw() {
        // Low resolution for speed
        const w = 200;
        const h = 150;
        const img = ctx.createImageData(w, h);
        const d = img.data;
        
        const cx = -0.7 + Math.sin(shift) * 0.1;
        const cy = 0.27015 + Math.cos(shift) * 0.1;
        
        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                let zx = 1.5 * (x - w / 2) / (0.5 * w);
                let zy = (y - h / 2) / (0.5 * h);
                let i = 300; // max iter
                while (zx * zx + zy * zy < 4 && i > 0) {
                    let tmp = zx * zx - zy * zy + cx;
                    zy = 2.0 * zx * zy + cy;
                    zx = tmp;
                    i--;
                }
                const p = (y * w + x) * 4;
                d[p] = (i * 8) % 255;
                d[p+1] = (i * 4) % 255;
                d[p+2] = (i * 16) % 255;
                d[p+3] = 255;
            }
        }
        
        // Scale up
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = w;
        tempCanvas.height = h;
        tempCanvas.getContext('2d').putImageData(img, 0, 0);
        
        ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
        
        shift += 0.02;
        requestAnimationFrame(draw);
    }
    draw();
</script>
</body>
</html>
