<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Block - Game 20/100</title>
    <style>
        :root {
            --bg: #050505;
            --p-blue: #00f2ff;
            --p-pink: #ff007a;
            --p-purple: #bc00ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            background: #000;
            border: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            max-width: 95vw;
            max-height: 80vh;
        }

        .ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 10;
        }

        .stat {
            text-align: center;
            font-family: monospace;
            text-shadow: 0 0 10px var(--p-blue);
        }

        .label { font-size: 10px; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; }
        .value { font-size: 24px; font-weight: 900; color: var(--p-blue); }

        .game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 5, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        h1 {
            font-size: 48px;
            background: linear-gradient(to right, var(--p-pink), var(--p-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 35px;
            background: transparent;
            border: 2px solid var(--p-blue);
            color: var(--p-blue);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--p-blue);
            color: black;
            box-shadow: 0 0 30px var(--p-blue);
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="ui">
        <div class="stat">
            <div class="label">LEVEL</div>
            <div id="level" class="value">1</div>
        </div>
        <div class="stat">
            <div class="label">PULSE CHARGE</div>
            <div id="charge" class="value">100%</div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="game-over" class="game-over">
        <h1>PULSE DISCONNECTED</h1>
        <p id="final-level" style="font-size: 24px; margin-bottom: 20px;">Level Reached: 1</p>
        <button onclick="initGame()">RESTORE PULSE</button>
    </div>

    <div class="controls-hint">Click or Touch to Flip Block Color</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const levelEl = document.getElementById('level');
        const chargeEl = document.getElementById('charge');
        const gameOverEl = document.getElementById('game-over');

        let width = 400, height = 600;
        let player, blocks, gameActive, level, charge, speed;

        class Player {
            constructor() {
                this.w = 40;
                this.h = 40;
                this.x = width / 2 - this.w / 2;
                this.y = height - 150;
                this.color = '#00f2ff';
            }
            flip() {
                this.color = this.color === '#00f2ff' ? '#ff007a' : '#00f2ff';
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.shadowBlur = 0;
            }
        }

        class Block {
            constructor() {
                this.w = 40 + Math.random() * 40;
                this.h = 40;
                this.x = Math.random() * (width - this.w);
                this.y = -100;
                this.color = Math.random() > 0.5 ? '#00f2ff' : '#ff007a';
                this.speed = speed;
            }
            update() {
                this.y += this.speed;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.shadowBlur = 0;
            }
        }

        function initGame() {
            canvas.width = width;
            canvas.height = height;
            player = new Player();
            blocks = [];
            gameActive = true;
            level = 1;
            charge = 100;
            speed = 4;
            levelEl.textContent = '1';
            chargeEl.textContent = '100%';
            gameOverEl.style.display = 'none';
            spawnBlock();
            animate();
        }

        function spawnBlock() {
            if (!gameActive) return;
            blocks.push(new Block());
            setTimeout(spawnBlock, Math.max(300, 1000 - (level * 20)));
        }

        function endGame() {
            gameActive = false;
            gameOverEl.style.display = 'flex';
            document.getElementById('final-level').textContent = `Level Reached: ${level}`;
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            player.draw();

            blocks.forEach((block, i) => {
                block.update();
                block.draw();

                if (block.y > height) {
                    blocks.splice(i, 1);
                    level++;
                    levelEl.textContent = level;
                    speed += 0.05;
                }

                // Collision Detection
                if (player.x < block.x + block.w &&
                    player.x + player.w > block.x &&
                    player.y < block.y + block.h &&
                    player.y + player.h > block.y) {
                    
                    if (player.color !== block.color) {
                        charge -= 10;
                        chargeEl.textContent = `${Math.floor(charge)}%`;
                        blocks.splice(i, 1);
                        if (charge <= 0) endGame();
                    } else {
                        charge = Math.min(100, charge + 2);
                        chargeEl.textContent = `${Math.floor(charge)}%`;
                        blocks.splice(i, 1);
                    }
                }
            });

            charge -= 0.05;
            chargeEl.textContent = `${Math.max(0, Math.floor(charge))}%`;
            if (charge <= 0) endGame();
        }

        canvas.addEventListener('mousedown', () => player.flip());
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); player.flip(); });

        initGame();
    </script>
</body>
</html>
