<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Balance - Game 38/100</title>
    <style>
        :root {
            --bg: #050505;
            --p-blue: #00f2ff;
            --p-pink: #ff007a;
            --p-purple: #bc00ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        canvas {
            background: #000;
            border: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            max-width: 95vw;
            max-height: 80vh;
        }

        .ui {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            pointer-events: none;
            z-index: 10;
        }

        .stat {
            text-align: center;
            font-family: monospace;
            text-shadow: 0 0 10px var(--p-blue);
        }

        .label { font-size: 10px; color: rgba(255, 255, 255, 0.5); text-transform: uppercase; }
        .value { font-size: 24px; font-weight: 900; color: var(--p-blue); }

        .game-over {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 5, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        h1 {
            font-size: 48px;
            background: linear-gradient(to right, var(--p-pink), var(--p-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 35px;
            background: transparent;
            border: 2px solid var(--p-blue);
            color: var(--p-blue);
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        button:hover {
            background: var(--p-blue);
            color: black;
            box-shadow: 0 0 30px var(--p-blue);
        }

        .controls-hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="ui">
        <div class="stat">
            <div class="label">TIME</div>
            <div id="time" class="value">0.0s</div>
        </div>
        <div class="stat">
            <div class="label">STABILITY</div>
            <div id="stability" class="value">100%</div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="game-over" class="game-over">
        <h1>STABILITY LOST</h1>
        <p id="final-time" style="font-size: 24px; margin-bottom: 20px;">Time: 0.0s</p>
        <button onclick="initGame()">RE-INIT SYSTEM</button>
    </div>

    <div class="controls-hint">Move Mouse or Tilt to Balance the Ball</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const timeEl = document.getElementById('time');
        const stabilityEl = document.getElementById('stability');
        const gameOverEl = document.getElementById('game-over');

        let width = 600, height = 400;
        let ball, platform, gameActive, startTime, tilt;

        class Ball {
            constructor() {
                this.radius = 12;
                this.x = width / 2;
                this.y = height / 2 - 50;
                this.vx = 0;
            }
            update() {
                this.vx += tilt * 0.5;
                this.vx *= 0.98;
                this.x += this.vx;
                
                if (this.x < 50 || this.x > width - 50) endGame();
            }
            draw() {
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#fff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Platform {
            constructor() {
                this.w = width - 100;
                this.h = 10;
                this.x = 50;
                this.y = height / 2;
            }
            draw() {
                ctx.save();
                ctx.translate(width/2, this.y);
                ctx.rotate(tilt);
                ctx.fillStyle = '#00f2ff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f2ff';
                ctx.fillRect(-this.w/2, 0, this.w, this.h);
                ctx.restore();
            }
        }

        function initGame() {
            canvas.width = width;
            canvas.height = height;
            ball = new Ball();
            platform = new Platform();
            tilt = 0;
            gameActive = true;
            startTime = Date.now();
            gameOverEl.style.display = 'none';
            animate();
        }

        function endGame() {
            gameActive = false;
            gameOverEl.style.display = 'flex';
            const finalTime = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById('final-time').textContent = `Time: ${finalTime}s`;
        }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, width, height);

            platform.draw();
            ball.update();
            ball.draw();

            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            timeEl.textContent = elapsed + 's';
            
            const stability = Math.max(0, 100 - Math.abs(tilt) * 200);
            stabilityEl.textContent = Math.floor(stability) + '%';
            if (stability <= 0) endGame();
        }

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            tilt = (e.clientX - rect.left - width / 2) / (width / 2) * 0.5;
        });

        window.addEventListener('deviceorientation', e => {
            tilt = e.gamma / 45 * 0.5;
        });

        initGame();
    </script>
</body>
</html>
